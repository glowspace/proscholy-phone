name: proscholy_workspace
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/proscholy_common
  - apps/zps
  - apps/ez
  - apps/ek

# tests of proscholy_common must use sqlite provided by system (same as sqflite on iOS and Android), bundled one does
# not support FTS4
hooks:
  user_defines:
    sqlite3:
      source: system
