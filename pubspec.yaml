name: zpevnik

publish_to: 'none'

version: 3.2.0+173

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  proscholy_common:
    git: https://github.com/glowspace/proscholy-phone-common.git

  sqflite: ^2.0.2+1
  firebase_core: ^3.10.1
  flutter_riverpod: ^2.6.1
  package_info_plus: ^8.1.3
  path: ^1.9.1
  sentry_flutter: ^8.12.0
  shared_preferences: ^2.4.0
  flutter_quill: ^11.0.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data.json
    - assets/svg.zip
    - assets/images/logos/
